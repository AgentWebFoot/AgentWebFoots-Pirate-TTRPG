<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        

    </head>

    <body>

        <div id="root"></div>

        <style>
            :root {
                --bg-main: rgb(47, 36, 23);
                --bg-panel: rgba(47, 36, 23, 0.92);
                --bg-card: rgba(248, 239, 217, 0.94);
                --bg-card-muted: rgba(230, 216, 184, 0.9);
                --bg-highlight: rgba(179, 137, 77, 0.18);
                --bg-input: rgba(47, 36, 23, 0.82);

                --text-main: #f6edd7;
                --text-muted: #d4c5a2;
                --text-ink: #2f2417;

                --accent: #b3894d;
                --accent-strong: #d9bb79;
                --line: rgba(92, 69, 36, 0.35);

                --font-main: "Trebuchet MS", sans-serif;
                --font-header: "Georgia", serif;

                --font-size-base: 14px;
                --font-size-large: 18px;
                --font-size-header: 22px;
            }

            body {
                margin: 0;
                background:
                    radial-gradient(circle at top, rgba(179, 137, 77, 0.26), transparent 35%),
                    linear-gradient(180deg, #3a2918 0%, #2b1e12 55%, #1d140d 100%);
                color: var(--text-main);
                font-family: var(--font-main);
                font-size: var(--font-size-base);
            }

            .panel {
                background: var(--bg-panel);
                border-radius: 8px;
                padding: 10px;
            }

            .card {
                background: var(--bg-card);
                border-radius: 6px;
                padding: 8px;
            }

            .highlight {
                background: var(--bg-highlight);
            }

            .app {
                display: grid;
                grid-template-rows: auto 1fr;
                grid-template-columns: var(--left-width, 320px) 1fr;
                transition: grid-template-columns 0.2s ease;
                min-height: 100vh;
            }

            .topbar {
                grid-column: 1 / span 2;
                display: grid;
                grid-template-columns: minmax(240px, 1fr) 1.7fr;
                gap: 16px;
                padding: 18px 22px;
                border-bottom: 1px solid rgba(217, 187, 121, 0.35);
                background:
                    linear-gradient(135deg, rgba(255, 247, 226, 0.98), rgba(226, 208, 168, 0.96)),
                    var(--bg-card);
                color: var(--text-ink);
                font-size: var(--font-size-large);
                box-shadow: inset 0 -1px 0 rgba(92, 69, 36, 0.18);
            }

            .folioIdentity {
                position: relative;
                display: flex;
                flex-direction: column;
                gap: 10px;
                isolation: isolate;
                overflow: visible;
            }

            .folioIdentity::after {
                content: "";
                position: absolute;
                top: 0px;
                left: 500px;
                width: 110px;
                height: 110px;
                background-image: url("SkullAndCrossbones.png");
                background-repeat: no-repeat;
                background-position: center;
                background-size: contain;
                opacity: 0.18;
                filter: blur(0.6px);
                transform: rotate(14deg);
                pointer-events: none;
                z-index: 0;
            }

            .folioIdentity > * {
                position: relative;
                z-index: 1;
            }

            .folioKicker {
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.14em;
                color: rgba(47, 36, 23, 0.68);
            }

            .folioTitle {
                font-family: var(--font-header);
                font-size: 34px;
                line-height: 1;
                margin: 0;
            }

            .folioIdentityGrid {
                display: grid;
                grid-template-columns: repeat(2, minmax(140px, 1fr));
                gap: 10px;
            }

            .folioField {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .folioField label,
            .resourceCard label,
            .background-field label {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.12em;
                color: rgba(47, 36, 23, 0.72);
            }

            .folioMeta {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
                gap: 10px;
                align-items: stretch;
            }

            .resourceCard {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                gap: 8px;
                min-height: 84px;
                padding: 12px;
                border: 1px solid rgba(92, 69, 36, 0.24);
                border-radius: 10px;
                background: rgba(255, 251, 241, 0.65);
                box-shadow: 0 4px 16px rgba(47, 36, 23, 0.08);
            }

            .leftpanel {
                padding: 16px 14px 28px;
                overflow-y: auto;
                border-right: 1px solid rgba(217, 187, 121, 0.2);
                transition: width 0.2s ease;
                background: linear-gradient(180deg, rgba(58, 41, 24, 0.96), rgba(29, 20, 13, 0.98));
            }

            .leftpanel.closed {
                width: 40px;
                overflow: hidden;
            }

            .ledgerHeader {
                margin: 14px 0 20px;
                padding-bottom: 14px;
                border-bottom: 1px solid rgba(217, 187, 121, 0.22);
            }

            .ledgerHeader h3 {
                margin: 0 0 6px;
                font-family: var(--font-header);
                font-size: 24px;
                color: var(--accent-strong);
            }

            .ledgerHeader p {
                margin: 0;
                color: var(--text-muted);
                line-height: 1.4;
            }

            .mainpage {
                padding: 20px;
                padding-bottom: 96px;
            }

            .folioHero,
            .folioSection {
                border: 1px solid var(--line);
                border-radius: 20px;
                background: linear-gradient(180deg, rgba(252, 246, 231, 0.98), rgba(233, 219, 188, 0.94));
                color: var(--text-ink);
                box-shadow: 0 16px 42px rgba(4, 11, 16, 0.24);
            }

            .folioHero {
                padding: 22px;
            }

            .statsHero {
                position: relative;
                overflow: hidden;
                isolation: isolate;
            }

            .statsHero::before {
                content: "";
                position: absolute;
                top: 260px;
                left: 160px;
                width: 260px;
                height: 260px;
                background-image: url("CompassRose.png");
                background-repeat: no-repeat;
                background-position: center;
                background-size: contain;
                opacity: 0.14;
                filter: blur(2.5px);
                transform: translate(-50%, -50%) rotate(-8deg);
                pointer-events: none;
                z-index: 0;
            }

            .statsHero::after {
                content: "";
                position: absolute;
                right: 0px;
                bottom: 0px;
                width: 300px;
                height: 300px;
                background-image: url("InkStain.png");
                background-repeat: no-repeat;
                background-position: center;
                background-size: contain;
                opacity: 0.16;
                filter: blur(2.5px);
                transform: rotate(-10deg);
                pointer-events: none;
                z-index: 0;
            }

            .statsHero > * {
                position: relative;
                z-index: 1;
            }

            .recordsSection {
                position: relative;
                overflow: hidden;
                isolation: isolate;
            }

            .recordsSection::before {
                content: "";
                position: absolute;
                top: 92px;
                right: 36px;
                width: 220px;
                height: 220px;
                background-image: url("Wheel.png");
                background-repeat: no-repeat;
                background-position: center;
                background-size: contain;
                opacity: 0.14;
                filter: blur(1.8px);
                transform: rotate(16deg);
                pointer-events: none;
                z-index: 0;
            }

            .recordsSection > * {
                position: relative;
                z-index: 1;
            }

            .folioHeroHeader,
            .sectionHeader {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 16px;
                margin-bottom: 20px;
            }

            .sectionHeader {
                padding: 18px 18px 0;
            }

            .sectionTitle {
                margin: 0;
                font-family: var(--font-header);
                font-size: 30px;
            }

            .sectionCopy {
                margin: 6px 0 0;
                max-width: 680px;
                line-height: 1.5;
                color: rgba(47, 36, 23, 0.78);
            }

            .skillPointBadge {
                min-width: 148px;
                padding: 10px 14px;
                border-radius: 12px;
                border: 1px solid rgba(92, 69, 36, 0.24);
                background: rgba(255, 250, 240, 0.72);
                text-align: right;
            }

            .skillPointBadge strong {
                display: block;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.12em;
                color: rgba(47, 36, 23, 0.65);
            }

            .skillPointBadge span {
                display: block;
                margin-top: 4px;
                font-size: 26px;
                font-family: var(--font-header);
            }

            .statRow {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(136px, 152px));
                gap: 10px;
                justify-content: center;
            }

            .statBlock {
                background: rgba(255, 252, 245, 0.68);
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 10px;
                border-radius: 12px;
                border: 1px solid rgba(92, 69, 36, 0.22);
                margin-bottom: 0;
                text-align: center;
            }

            .statBlock ul {
                list-style: none;
                padding-left: 0;
                margin: 0;
            }

            li {
                background: rgba(230, 216, 184, 0.42);
                margin-top: 8px;
                margin-bottom: 0;
                padding: 8px;
                border-radius: 8px;
                border: 1px solid rgba(92, 69, 36, 0.12);
            }

            button {
                background: var(--accent);
                border: none;
                padding: 7px 12px;
                border-radius: 8px;
                cursor: pointer;
                color: #fff8ea;
                font-weight: 600;
            }

            .skills button {
                padding: 5px 10px;
            }

            .statButtons button {
                padding: 5px 10px;
            }

            .skills {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                text-align: center;
            }

            button:hover {
                opacity: 0.85;
            }
            
            .statBlock h3 {
                font-size: 22px;
                margin: 0 0 6px 0;
                font-family: var(--font-header);
            }

            .statBlock > input {
                width: 64px;
                margin: 0 auto;
                font-size: 14px;
                text-align: center;
            }

            .skills input {
                width: 64px;
                margin: 0 auto;
                text-align: center;
            }

            .statBlock > input[type="number"],
            .skills input[type="number"] {
                appearance: textfield;
                -moz-appearance: textfield;
                padding-left: 9px;
                padding-right: 9px;
            }

            .statBlock > input[type="number"]::-webkit-outer-spin-button,
            .statBlock > input[type="number"]::-webkit-inner-spin-button,
            .skills input[type="number"]::-webkit-outer-spin-button,
            .skills input[type="number"]::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }

            input, select {
                background: var(--bg-input);
                color: var(--text-main);
                border: 1px solid rgba(217, 187, 121, 0.35);
                border-radius: 8px;
                padding: 7px 9px;
            }

            .topbar input,
            .topbar select {
                background: rgba(45, 33, 21, 0.92);
            }

            .tabBar {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                padding: 0 18px;
                margin-bottom: 14px;
            }

            .tabContent {
                padding: 0 18px 18px;
            }

            .journalGrid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 220px));
                gap: 12px;
                padding: 0 18px 18px;
                justify-content: center;
            }

            .background-section {
                margin-bottom: 0;
                padding: 12px;
                border-radius: 12px;
                border: 1px solid rgba(92, 69, 36, 0.16);
                background: rgba(255, 251, 242, 0.62);
            }

            .background-section h4 {
                margin: 0 0 10px;
                font-family: var(--font-header);
                font-size: 20px;
            }

            .background-field {
                display: flex;
                flex-direction: column;
                gap: 6px;
                margin-bottom: 12px;
            }

            .background-field input {
                padding: 4px 6px;
                width: min(100%, 180px);
            }

            .background-field textarea {
                width: min(100%, 240px);
                height: 92px;
                background: rgba(45, 33, 21, 0.92);
                color: var(--text-main);
                border: 1px solid rgba(217, 187, 121, 0.35);
                border-radius: 8px;
                padding: 8px;
                box-sizing: border-box;
                resize: none;
            }

            .sectionSpacer {
                margin-top: 24px;
            }

            @media (max-width: 1100px) {
                .app {
                    grid-template-columns: 1fr;
                }

                .topbar {
                    grid-template-columns: 1fr;
                    padding: 16px 18px;
                }

                .leftpanel {
                    border-right: none;
                    border-bottom: 1px solid rgba(217, 187, 121, 0.2);
                }

                .mainpage {
                    padding: 16px;
                    padding-bottom: 88px;
                }

                .folioHero {
                    padding: 18px;
                }
            }
        </style>

        <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>


        <script type="text/babel">
            // Map each stat and skill together
            const stats = {
                Brawn:["Rigging","Lifting","Pinning","Swimming"],
                Finesse:["Acrobatics","Skulduggery","Sneaking"],
                Grit:["Nausea","Resilience","Tolerance"],
                Awareness:["Fishing","Investigation","Intuition","Tracking"],
                Brains:["History","Learning","Tinkering"],
                Swagger:["Infamy","Influence","Negotiation"]
            }

            // Allows for reverse lookup: skill -> stat
            const SKILL_TO_STAT = {}
                Object.entries(stats).forEach(([stat,skills])=>{
                skills.forEach(skill=>{
                SKILL_TO_STAT[skill] = stat
                })
            })

            const STAT_LIST = Object.keys(stats)
            const SKILL_LIST = Object.values(stats).flat()

            const createEmptyStatLevel = ()=>({
                Brawn:0,
                Finesse:0,
                Grit:0,
                Awareness:0,
                Brains:0,
                Swagger:0
            })

            const createEmptySkillLevel = ()=>(
                Object.fromEntries(SKILL_LIST.map(skill=>[skill,0]))
            )

            function trimFutureLevelData(levelData,nextLevel,createEmptyLevel){
                const trimmed = [...levelData]

                for(let i = nextLevel; i < trimmed.length; i++){
                    trimmed[i] = createEmptyLevel()
                }

                return trimmed
            }

            function moveArrayItem(list,index,direction){
                const nextIndex = index + direction

                if(index < 0 || nextIndex < 0 || index >= list.length || nextIndex >= list.length){
                    return list
                }

                const next = [...list]
                const [item] = next.splice(index,1)
                next.splice(nextIndex,0,item)
                return next
            }

            // All types of weapons
            const WEAPON_TYPES = [
                "Strike",
                "Blunt",
                "Sword",
                "Axe",
                "Polearm",
                "Hand Firearm",
                "Sniper Firearm",
                "Grenade"
            ]

            const UNARMED_WEAPON_NAME = "Unarmed Strike"

            // Classes that give a bonus of rank to each weapon type
            const CLASS_WEAPON_BONUS = {
                Basher: ["Blunt"],
                Cleaver: ["Axe"],
                Marksman: ["Hand Firearm"],
                "Martial Artist": ["Strike"],
                Sharpshooter: ["Sniper Firearm"],
                Spearman: ["Polearm"],
                Swordsman: ["Sword"]
            }

            // Stat level up system. Players gain 10 points at level 1 and 1 point for each level after
            // Max at level 1 is 5, max at all other levels is 10
            const LEVEL_POINTS = level => level === 1 ? 10 : 1
            const LEVEL_STAT_CAP = level => level === 1 ? 5 : 10
            
            // Skill level up system. Players gain 10 points at level 1 and 2 points for each level after
            const LEVEL_SKILL_POINTS = level => level === 1 ? 10 : 2

            // Armor Statistics
            const BASE_ARMOR_STATS = {
                "No Armor": { 
                    baseEvasion:16, 
                    toughness:0 
                },
                "Leather Armor": { 
                    baseEvasion:14, 
                    toughness:2 
                },
                "Chain Mail": { 
                    baseEvasion:12, 
                    toughness:3 
                },
                "Plate Armor": { 
                    baseEvasion:10, 
                    toughness:4 
                }
            }

            // Shield Statistics
            const BASE_SHIELD_STATS = {
                "No Shield":{
                toughness:0,
                braceCost:0,
                properties:[]
                },
                "Buckler":{
                toughness:1,
                braceCost:2,
                properties:["Attachable","Parry"]
                },
                "Round Shield":{
                toughness:2,
                braceCost:3,
                properties:[]
                },
                "Tower Shield":{
                toughness:4,
                braceCost:4,
                properties:[]
                }
            }

            function MainPage({
                finalStats,
                classCounts,
                skillTotals,
                currentLevel,
                levelSkills,
                setLevelSkills,
                availableSkillPoints,
                armor,
                setArmor,
                shield,
                setShield,
                useShield,
                setUseShield,
                armorStatsMap,
                shieldStatsMap,
                shieldStats,
                weapons,
                equippedWeapons,
                removeWeapon,
                inventoryWeapons,
                swapWeapon,
                moveWeapon,
                weaponChoice,
                setWeaponChoice,
                addWeaponToInventory,
                doubloons,
                setDoubloons,
                items,
                addItem,
                updateItem,
                removeItem,
                moveItem,
                weaponTypeBonuses,
                settings,
                setSettings,
                sortBy,
                setSortBy,
                sortedActionAbilities,
                passiveAbilities,
                background,
                setBackground,
                expansions,
                importExpansionFile,
                removeExpansion,
                exportExpansions,
                downloadGearTemplate,
                downloadClassTemplate
                }) {

                const [activeTab,setActiveTab] = React.useState("class")

                function renderBackgroundJournal(){
                    return (
                    <div className="journalGrid">
                    <div className="background-section">
                    <h4>Identity</h4>
                    <div className="background-field">
                        <label>Age</label>
                        <input placeholder="Age" value={background.age} onChange={e=>setBackground(p=>({...p, age:e.target.value}))} />
                    </div>
                    <div className="background-field">
                        <label>Gender</label>
                        <input placeholder="Gender" value={background.gender} onChange={e=>setBackground(p=>({...p, gender:e.target.value}))} />
                    </div>
                    <div className="background-field">
                        <label>Race</label>
                        <input placeholder="Race" value={background.race} onChange={e=>setBackground(p=>({...p, race:e.target.value}))} />
                    </div>
                    <div className="background-field">
                        <label>Country</label>
                        <input placeholder="Country" value={background.country} onChange={e=>setBackground(p=>({...p, country:e.target.value}))} />
                    </div>
                    <div className="background-field">
                        <label>Religion</label>
                        <input placeholder="Religion" value={background.religion} onChange={e=>setBackground(p=>({...p, religion:e.target.value}))} />
                    </div>
                    </div>

                    <div className="background-section">
                    <h4>Physical</h4>
                    <div className="background-field">
                        <label>Height</label>
                        <input placeholder="Height" value={background.height} onChange={e=>setBackground(p=>({...p, height:e.target.value}))} />
                    </div>
                    <div className="background-field">
                        <label>Weight</label>
                        <input placeholder="Weight" value={background.weight} onChange={e=>setBackground(p=>({...p, weight:e.target.value}))} />
                    </div>
                    <div className="background-field">
                        <label>Eye Color</label>
                        <input placeholder="Eye Color" value={background.eyeColor} onChange={e=>setBackground(p=>({...p, eyeColor:e.target.value}))} />
                    </div>
                    <div className="background-field">
                        <label>Hair Color</label>
                        <input placeholder="Hair Color" value={background.hairColor} onChange={e=>setBackground(p=>({...p, hairColor:e.target.value}))} />
                    </div>
                    <div className="background-field">
                        <label>Distinguishing Features</label>
                        <textarea placeholder="Distinguishing Features" value={background.features} onChange={e=>setBackground(p=>({...p, features:e.target.value}))} />
                    </div>
                    </div>

                    <div className="background-section">
                    <h4>Background</h4>
                    <div className="background-field">
                        <label>Former Crews</label>
                        <input placeholder="Former Crews" value={background.formerCrews} onChange={e=>setBackground(p=>({...p, formerCrews:e.target.value}))} />
                    </div>
                    <div className="background-field">
                        <label>Occupation</label>
                        <input placeholder="Occupation" value={background.occupation} onChange={e=>setBackground(p=>({...p, occupation:e.target.value}))} />
                    </div>
                    <div className="background-field">
                        <label>Reputation</label>
                        <input placeholder="Reputation" value={background.reputation} onChange={e=>setBackground(p=>({...p, reputation:e.target.value}))} />
                    </div>
                    </div>

                    <div className="background-section">
                    <h4>Captain's Journal</h4>
                    <div className="background-field">
                        <label>Personality</label>
                        <textarea placeholder="Personality" value={background.personality} onChange={e=>setBackground(p=>({...p, personality:e.target.value}))} />
                    </div>
                    <div className="background-field">
                        <label>Backstory</label>
                        <textarea placeholder="Backstory" value={background.backstory} onChange={e=>setBackground(p=>({...p, backstory:e.target.value}))} />
                    </div>
                    <div className="background-field">
                        <label>Goals</label>
                        <textarea placeholder="Goals" value={background.goals} onChange={e=>setBackground(p=>({...p, goals:e.target.value}))} />
                    </div>
                    <div className="background-field">
                        <label>Notes</label>
                        <textarea placeholder="Notes" value={background.notes} onChange={e=>setBackground(p=>({...p, notes:e.target.value}))} />
                    </div>
                    </div>
                    </div>
                    )
                }

                return (
                <div className="mainpage">

                <section className="folioHero statsHero">
                <div className="folioHeroHeader">
                    <div>
                        <div className="folioKicker">Crew Record</div>
                        <h2 className="sectionTitle">Stats and Skills</h2>
                    </div>
                    <div className="skillPointBadge">
                        <strong>Available Skill Points</strong>
                        <span style={{color: availableSkillPoints === 0 ? "#8b6e3b" : "#2f2417"}}>{availableSkillPoints}</span>
                    </div>
                </div>

                <div className="statRow">
                {Object.entries(stats).map(([stat,skills])=>(
                <div className="statBlock" key={stat}>

                <h3>{stat}</h3>

                <input
                type="number"
                value={Number.isFinite(finalStats[stat]) ? finalStats[stat] : 0}
                readOnly
                />
                <ul>
                    {skills.map(skill=>(
                    <li key={skill}>

                    <div className="skills">
                        {skill}

                        <div>
                            <input
                            type="number"
                            value={Number.isFinite(skillTotals[skill]) ? skillTotals[skill] : 0}
                            readOnly
                            />
                        </div>

                        <div>

                            <button onClick={()=>removeSkill(currentLevel,skill,levelSkills,setLevelSkills)}>-</button>

                            <span>
                            {levelSkills
                                .slice(0,currentLevel)
                                .reduce((sum,lvl)=>sum + lvl[skill],0)}
                            </span>

                            <button onClick={()=>addSkill(currentLevel,skill,levelSkills,setLevelSkills,availableSkillPoints)}>+</button>

                        </div>
                    </div>

                    </li>
                    ))}
                </ul>

                </div>
                ))}
                </div>

            function mergeClassGroups(baseGroups, expansionGroups){
                const groupMap = new Map(
                    baseGroups.map(group => [group.title, [...group.classes]])
                )

                expansionGroups.forEach(group=>{
                    if(!group || !group.title || !Array.isArray(group.classes)) return

                    if(!groupMap.has(group.title)){
                        groupMap.set(group.title, [])
                    }

                    const existing = groupMap.get(group.title)

                    group.classes.forEach(cls=>{
                        if(typeof cls === "string" && cls && !existing.includes(cls)){
                            existing.push(cls)
                        }
                    })
                })

                return Array.from(groupMap.entries()).map(([title, classes])=>({
                    title,
                    classes
                }))
            }

            function mergeNamedStats(baseStats, expansionEntries){
                const merged = {...baseStats}

                expansionEntries.forEach(entry=>{
                    if(!entry || typeof entry.name !== "string" || !entry.name.trim()) return
                    merged[entry.name] = {...entry}
                    delete merged[entry.name].name
                })

                return merged
            }

            function normalizeExpansion(raw, fallbackName){
                if(!raw || typeof raw !== "object"){
                    throw new Error("Expansion file must be a JSON object.")
                }

                const name = typeof raw.name === "string" && raw.name.trim()
                    ? raw.name.trim()
                    : fallbackName

                const classGroups = Array.isArray(raw.classGroups) ? raw.classGroups : []
                const classAbilities = Array.isArray(raw.classAbilities) ? raw.classAbilities : []
                const weapons = Array.isArray(raw.weapons) ? raw.weapons : []
                const armors = Array.isArray(raw.armors) ? raw.armors : []
                const shields = Array.isArray(raw.shields) ? raw.shields : []

                return {
                    id: typeof raw.id === "string" && raw.id.trim()
                        ? raw.id.trim()
                        : `${name}-${Date.now()}`,
                    name,
                    classGroups,
                    classAbilities,
                    weapons,
                    armors,
                    shields
                }
            }

            function addStat(level,stat,levelStats,setLevelStats){

                const levelIndex = level-1

                const spent = Object.values(levelStats[levelIndex]).reduce((a,b)=>a+b,0)
                const levelLimit = LEVEL_POINTS(level)

                if(spent >= levelLimit) return

                const statTotal = levelStats.reduce((sum,lvl)=>sum + lvl[stat],0)

                if(statTotal >= 10) return
                if(level === 1 && levelStats[levelIndex][stat] >= 5) return

                const newLevelStats=[...levelStats]
                newLevelStats[levelIndex][stat]++

                setLevelStats(newLevelStats)
            }

            function removeStat(level,stat,levelStats,setLevelStats){

                const levelIndex = level-1
                if(levelStats[levelIndex][stat] <= 0) return

                const newLevelStats=[...levelStats]
                newLevelStats[levelIndex][stat]--

                setLevelStats(newLevelStats)
            }

            function addSkill(level,skill,levelSkills,setLevelSkills,availableSkillPoints){
                const idx = level - 1

                if(availableSkillPoints <= 0) return

                const skillTotal =
                levelSkills
                .slice(0, level)
                .reduce((sum,lvl)=>sum + lvl[skill],0)

                if(skillTotal >= 10) return

                const newSkills = [...levelSkills]
                newSkills[idx][skill]++

                setLevelSkills(newSkills)
                }

            function removeSkill(level,skill,levelSkills,setLevelSkills){

                const idx=level-1
                if(levelSkills[idx][skill]===0) return

                const newSkills=[...levelSkills]
                newSkills[idx][skill]--

                setLevelSkills(newSkills)
            }

            function App(){
                // All initial values
                const [loaded, setLoaded] = React.useState(false)

                const [crew,setCrew] = React.useState("")

                const [levelStats,setLevelStats] = React.useState(
                Array.from({length:20},createEmptyStatLevel)
                )

                const activeStats = levelStats.slice(0,currentLevel)
                    
                const statTotals = {
                    Brawn:0,
                    Finesse:0,
                    Grit:0,
                    Awareness:0,
                    Brains:0,
                    Swagger:0
                }

                activeStats.forEach(level=>{
                STAT_LIST.forEach(stat=>{
                statTotals[stat]+=level[stat]
                })
                })

                const finalStats = {...statTotals}

                    if(val !== null && !Number.isNaN(val)){
                        finalStats[stat] = val
                    }
                })

                function getAvailableStatPoints(level, levelStats){
                    const idx = level - 1

                    const spent = Object.values(levelStats[idx]).reduce((a,b)=>a+b,0)
                    const max = LEVEL_POINTS(level)

                    return max - spent
                }

                // Skill with Override system
                
                let totalSkillPoints = 10 + (currentLevel - 1) * 2

                const spentSkillPoints =
                levelSkills
                .slice(0,currentLevel)
                .reduce((sum,level)=>{
                return sum + Object.values(level).reduce((a,b)=>a+b,0)
                },0)

                const availableSkillPoints = settings.skillPointsOverride ?? (totalSkillPoints - spentSkillPoints)

                const activeSkills = levelSkills.slice(0,currentLevel)

                const skillTotals = {}
                    Object.values(stats).flat().forEach(skill=>{
                    skillTotals[skill] = 0
                })

                activeSkills.forEach(level=>{
                    Object.keys(level).forEach(skill=>{
                    skillTotals[skill] += level[skill]
                    })

                // Health with override system

                    setHealth(prev =>

                    )

                // Endurance with override system
                const nonGritStats = [
                    finalStats.Brawn,
                    finalStats.Finesse,
                    finalStats.Awareness,
                    finalStats.Brains,
                    finalStats.Swagger
                ]

                const topTwo = nonGritStats
                    .sort((a, b) => b - a)
                    .slice(0, 2)

                const baseEndurance = Math.round(
                    (topTwo[0] + topTwo[1] + finalStats.Grit)/2 * currentLevel
                )

                const maxEndurance =
                settings.enduranceMax ?? Math.max(10, baseEndurance)

                const minEndurance =
                settings.enduranceMin ?? 0

                React.useEffect(()=>{
                    setEndurance(prev =>

                // Speed with override system

                const [expansions, setExpansions] = React.useState([])

                // Create list of all taken levels and calculate a count for each
                const selectedClasses = [
                    ...level1,

                    selectedClasses.forEach(cls=>{
                    classCounts[cls] = (classCounts[cls] || 0) + 1
                })
                
                // Weapon bonus with override system
                const weaponTypeBonuses = {}

                Object.entries(classCounts).forEach(([cls, rank]) => {
                    const types = CLASS_WEAPON_BONUS[cls]
                    if(!types) return

                    types.forEach(type => {
                        weaponTypeBonuses[type] = Math.max(
                            weaponTypeBonuses[type] || 0,
                            rank
                        )
                    })
                })
                const [equippedWeapons,setEquippedWeapons] = React.useState([])
                const [weaponChoice,setWeaponChoice] = React.useState("")

                const [inventoryWeapons,setInventoryWeapons] = React.useState([]) 

                React.useEffect(()=>{
                fetch("weapons.JSON")
                .then(res=>res.json())
                .then(data=>setBaseWeapons(data))
                },[])

                React.useEffect(()=>{
                    const unarmedWeapon = weapons.find(w=>w.name === UNARMED_WEAPON_NAME)
                    if(!unarmedWeapon) return

                    setEquippedWeapons(prev=>{
                        if(prev.some(w=>w.name === UNARMED_WEAPON_NAME)){
                            return prev
                        }

                        return [unarmedWeapon, ...prev]
                    })

                    setInventoryWeapons(prev=>prev.filter(w=>w.name !== UNARMED_WEAPON_NAME))
                }, [weapons])

                // Control weapons and list location in the Combat tab
                function addWeaponToInventory(name){
                    if(name === UNARMED_WEAPON_NAME) return

                    const weapon = weapons.find(w=>w.name === name)
                    if(!weapon) return

                    setInventoryWeapons([...inventoryWeapons,weapon])

                }

                function swapWeapon(index,from){
                    if(from === "inventory"){

                    const weapon = inventoryWeapons[index]
                    if(!weapon || weapon.name === UNARMED_WEAPON_NAME) return

                    setInventoryWeapons(inventoryWeapons.filter((_,i)=>i!==index))
                    setEquippedWeapons([...equippedWeapons,weapon])

                    }

                    else{

                    const weapon = equippedWeapons[index]
                    if(!weapon || weapon.name === UNARMED_WEAPON_NAME) return

                    setEquippedWeapons(equippedWeapons.filter((_,i)=>i!==index))
                    setInventoryWeapons([...inventoryWeapons,weapon])

                    }

                }

                function removeWeapon(index, from){
                    if(from === "equipped"){
                    if(equippedWeapons[index]?.name === UNARMED_WEAPON_NAME) return

                    setEquippedWeapons(
                    equippedWeapons.filter((_,i)=>i !== index)
                    )

                    }

                    if(from === "inventory"){
                    if(inventoryWeapons[index]?.name === UNARMED_WEAPON_NAME) return

                    setInventoryWeapons(
                    inventoryWeapons.filter((_,i)=>i !== index)
                    )

                    }

                }

                function moveWeapon(index, from, direction){
                    if(from === "equipped"){
                        setEquippedWeapons(prev=>moveArrayItem(prev,index,direction))
                    }

                    if(from === "inventory"){
                        setInventoryWeapons(prev=>moveArrayItem(prev,index,direction))
                    }
                }

                // Inventory Items
                const [doubloons, setDoubloons] = React.useState(0)
                const [items, setItems] = React.useState([])

                function createCombatInventoryItem(name, notes, combatKey){
                    return {
                        id: Date.now() + Math.random(),
                        name,
                        notes,
                        charges: 0,
                        amount: 1,
                        isCombatGear: true,
                        combatKey
                    }
                }

                function addItem(){
                    setItems(prev => [
                        ...prev,
                        {
                            id: Date.now(),
                            name: "",
                            notes: "",
                            charges: 0,
                            amount: 1
                        }
                    ])
                }

                function updateItem(id, field, value){
                    setItems(prev =>
                        prev.map(item =>
                            item.id === id
                                ? { ...item, [field]: value }
                                : item
                        )
                    )
                }

                function removeItem(id){
                    setItems(prev => prev.filter(item => item.id !== id))
                }

                function moveItem(index, direction){
                    setItems(prev=>{
                        const currentItem = prev[index]
                        if(!currentItem) return prev

                        const nextIndex = index + direction
                        if(nextIndex < 0 || nextIndex >= prev.length) return prev

                        return moveArrayItem(prev,index,direction)
                    })
                }

                // Armor Calculations for evasion and shield
                const [armor,setArmor] = React.useState("No Armor")
                const [useShield, setUseShield] = React.useState(true)
                const [shield,setShield] = React.useState("No Shield")

                const armorStats = armorStatsMap[armor] || armorStatsMap["No Armor"]
                const shieldStats = shieldStatsMap[shield] || shieldStatsMap["No Shield"]

                const evasion =
                settings.evasionOverride ??
                (armorStats.baseEvasion + Math.floor(finalStats.Finesse/2))

                const toughness =
                settings.toughnessOverride ??
                (
                    armorStats.toughness +
                    (useShield ? shieldStats.toughness : 0)
                )

                React.useEffect(()=>{
                    const trackedCombatItems = [
                        ...equippedWeapons
                        .filter(weapon=>weapon.name !== UNARMED_WEAPON_NAME)
                        .map(weapon=>({
                            name: weapon.name,
                            notes: "Weapon",
                            combatKey: `weapon:${weapon.name}:equipped`
                        })),
                        ...inventoryWeapons
                        .filter(weapon=>weapon.name !== UNARMED_WEAPON_NAME)
                        .map((weapon,index)=>({
                            name: weapon.name,
                            notes: "Weapon",
                            combatKey: `weapon:${weapon.name}:inventory:${index}`
                        })),
                        ...(armor !== "No Armor" ? [{
                            name: armor,
                            notes: "Armor",
                            combatKey: `armor:${armor}`
                        }] : []),
                        ...(shield !== "No Shield" ? [{
                            name: shield,
                            notes: "Shield",
                            combatKey: `shield:${shield}`
                        }] : [])
                    ]

                    setItems(prev=>{
                        const trackedMap = new Map(
                            trackedCombatItems.map(combatItem => [combatItem.combatKey, combatItem])
                        )

                        const nextItems = []

                        prev.forEach(item=>{
                            if(item.isCombatGear || item.isWeapon){
                                const combatItem = trackedMap.get(item.combatKey)
                                if(!combatItem) return

                                nextItems.push({
                                    ...item,
                                    name: combatItem.name,
                                    notes: combatItem.notes,
                                    charges: 0,
                                    amount: 1,
                                    isCombatGear: true,
                                    combatKey: combatItem.combatKey
                                })

                                trackedMap.delete(item.combatKey)
                                return
                            }

                            nextItems.push(item)
                        })

                                createCombatInventoryItem(

                                    combatItem.notes,
                                    combatItem.combatKey

                function importExpansionFile(){

                    input.onchange = e => {
                        const file = e.target.files[0]
                        if(!file) return

                        const reader = new FileReader()

                        reader.onload = event => {
                            try{
                                const raw = JSON.parse(event.target.result)
                                const imported = Array.isArray(raw) ? raw : [raw]
                                const normalizedList = imported.map((expansion, index)=>
                                    normalizeExpansion(
                                        expansion,
                                        imported.length === 1
                                            ? file.name.replace(/\.json$/i, "")
                                            : `${file.name.replace(/\.json$/i, "")} ${index + 1}`
                                    )
                                )

                                setExpansions(prev=>{
                                    const remaining = prev.filter(existing =>
                                        !normalizedList.some(expansion => expansion.id === existing.id)
                                    )
                                    return [...remaining, ...normalizedList]
                                })
                            } catch(err){
                                console.error(err)

                            }
                        }

                        reader.readAsText(file)
                    }

                                }
                                // Make sure there is no invalid
                                if(typeof raw !== "object" || raw === null){
                                    alert("Invalid file")
                                    return
                                }
                                // Make sure character sheet is not too old
                                if(raw.version !== 1.1 && raw.version !== 1.2){
                                    alert("Invalid version")
                                    return
                                }

                                delete raw.__proto__
                                delete raw.constructor
                                delete raw.prototype

                                setName(raw.name ?? "")
                                setCrew(raw.crew ?? "")
                                setCurrentLevel(raw.currentLevel ?? 1)
                                setLevels(raw.levels ?? Array(20).fill(null))
                                setLevel1(raw.level1 ?? ["","",""])
                                setLevelStats(raw.levelStats ?? levelStats)
                                setLevelSkills(raw.levelSkills ?? levelSkills)
                        setSettings(raw.settings ?? settings)
                        setArmor(raw.armor ?? "No Armor")
                        setShield(raw.shield ?? "No Shield")
                        setEquippedWeapons((raw.equippedWeapons ?? []).filter(w=>w?.name !== UNARMED_WEAPON_NAME))
                        setInventoryWeapons((raw.inventoryWeapons ?? []).filter(w=>w?.name !== UNARMED_WEAPON_NAME))
                                setHealth(raw.health ?? 0)
                                setEndurance(raw.endurance ?? 0)
                                setLuck(raw.luck ?? 3)
                                setDoubloons(raw.doubloons ?? 0)
                                if(Array.isArray(raw.expansions)){
                                    setExpansions(
                                        raw.expansions.map((expansion, index)=>
                                            normalizeExpansion(expansion, expansion?.name || `Expansion ${index + 1}`)
                                        )
                                    )
                                }
                                setItems(raw.inventoryItems ?? [])
                                setBackground(raw.background ?? DEFAULT_BACKGROUND)

                            } catch(err){
                                console.error(err)
                                alert("Invalid file")
                            }
                        }

                        reader.readAsText(file)
                    }

                    input.click()
                }

                // Local Save
                const SAVE_SLOTS = ["slot1","slot2","slot3"]
                const [activeSlot, setActiveSlot] = React.useState("slot1")
                const [saveMessage, setSaveMessage] = React.useState("")

                function buildSaveData(){
                    return {
                        name,
                        crew,
                        currentLevel,
                        levels,
                        level1,
                        levelStats,
                        levelSkills,
                        settings,
                        armor,
                        shield,
                        equippedWeapons,
                        inventoryWeapons,
                        health,
                        endurance,
                        luck,
                        doubloons,
                        items,
                        expansions,
                        background,
                        version: 1.2,
                        timestamp: Date.now()
                    }
                }

                function saveToSlot(slot = activeSlot){
                    const data = buildSaveData()

                    localStorage.setItem(
                        `characterSheet_${slot}`,
                        JSON.stringify(data)
                    )

                    console.log(`Saved to ${slot}`, data)
                    setSaveMessage(`Saved to ${slot}`)
                }

                function loadFromSlot(slot = activeSlot){
                    const saved = localStorage.getItem(`characterSheet_${slot}`)

                    if(!saved){
                        console.log(`No save in ${slot}`)
                        setSaveMessage(`No save found in ${slot}`)
                        return
                    }

                    try{
                        const data = JSON.parse(saved)

                        console.log(`Loaded from ${slot}`, data)
                        setSaveMessage(`Loaded from ${slot}`)

                        setName(data.name ?? "")
                        setCrew(data.crew ?? "")
                        setCurrentLevel(data.currentLevel ?? 1)
                        setLevels(data.levels ?? Array(20).fill(null))
                        setLevel1(data.level1 ?? ["","",""])
                        setLevelStats(data.levelStats ?? levelStats)
                        setLevelSkills(data.levelSkills ?? levelSkills)
                        setSettings(data.settings ?? settings)
                        setArmor(data.armor ?? "No Armor")
                        setShield(data.shield ?? "No Shield")
                        setEquippedWeapons((data.equippedWeapons ?? []).filter(w=>w?.name !== UNARMED_WEAPON_NAME))
                        setInventoryWeapons((data.inventoryWeapons ?? []).filter(w=>w?.name !== UNARMED_WEAPON_NAME))
                        setHealth(data.health ?? 0)
                        setEndurance(data.endurance ?? 0)
                        setLuck(data.luck ?? 3)
                        setDoubloons(data.doubloons ?? 0)
                        if(Array.isArray(data.expansions)){
                            setExpansions(
                                data.expansions.map((expansion, index)=>
                                    normalizeExpansion(expansion, expansion?.name || `Expansion ${index + 1}`)
                                )
                            )
                        }
                        setItems(data.items ?? [])
                        setBackground(data.background ?? background)

                    } catch(e){
                        console.error("Failed to load", e)
                        setSaveMessage("Failed to load save (invalid data)")
                    }
                }

                function clearSlot(slot = activeSlot){
                    const confirmDelete = window.confirm(
                        `Are you sure you want to clear ${slot}? This cannot be undone.`
                    )

                    if(!confirmDelete) return

                    localStorage.removeItem(`characterSheet_${slot}`)

                    console.log(`Cleared ${slot}`)
                    setSaveMessage(`Cleared ${slot}`)
                }

                React.useEffect(()=>{
                    loadFromSlot(activeSlot)
                }, [])

                // 5 minutes autosave
                React.useEffect(()=>{
                    const interval = setInterval(()=>{
                        saveToSlot(activeSlot)
                        console.log("Autosaved")
                    }, 300000) 

                    return ()=>clearInterval(interval)
                }, [activeSlot])

                React.useEffect(()=>{
                    if(!saveMessage) return

                    const t = setTimeout(()=>{
                        setSaveMessage("")
                    }, 3000)

                    return ()=>clearTimeout(t)
                }, [saveMessage])

                React.useEffect(()=>{
                    loadFromSlot(activeSlot)
                }, [activeSlot])

                return(
                    <div
                        className="app"
                        style={{
                            "--left-width": isLeftOpen ? "320px" : "60px"
                        }}
                    >
                    <TopBar
                        name={name}
                        setName={setName}
                        crew={crew}
                        setCrew={setCrew}
                        currentLevel={currentLevel}
                        setCurrentLevel={setCurrentLevel}
                        setLevelStats={setLevelStats}
                        setLevelSkills={setLevelSkills}
                        evasion={evasion}
                        endurance={endurance}
                        setEndurance={setEndurance}
                        minEndurance={minEndurance}
                        maxEndurance={maxEndurance}
                        toughness={toughness}
                        health={health}
                        setHealth={setHealth}
                        minHealth={minHealth}
                        maxHealth={maxHealth}
                        speed={speed}
                        dashSpeed={dashSpeed}
                        luck={luck}
                        maxLuck={maxLuck}
                        setLuck={setLuck}
                        settings={settings}
                        
                    />

                    <LeftPanel
                        finalStats={finalStats}
                        levelStats={levelStats}
                        setLevelStats={setLevelStats}
                        levels={levels}
                        setLevels={setLevels}
                        level1={level1}
                        setLevel1={setLevel1}
                        classGroups={classGroups}
                        classCounts={classCounts}
                        getAvailableStatPoints={getAvailableStatPoints}
                        isOpen={isLeftOpen}
                        toggleOpen={()=>setIsLeftOpen(prev=>!prev)}
                    />

                    <MainPage
                        finalStats={finalStats}
                        classCounts={classCounts}
                        skillTotals={skillTotals}
                        currentLevel={currentLevel}
                        levelSkills={levelSkills}
                        setLevelSkills={setLevelSkills}
                        availableSkillPoints={availableSkillPoints}
                        armor={armor}
                        setArmor={setArmor}
                        shield={shield}
                        setShield={setShield}
                        useShield={useShield}
                        setUseShield={setUseShield}
                        armorStatsMap={armorStatsMap}
                        shieldStatsMap={shieldStatsMap}
                        shieldStats={shieldStats}
                        weapons={weapons}
                        equippedWeapons={equippedWeapons}
                        removeWeapon={removeWeapon}
                        inventoryWeapons={inventoryWeapons}
                        swapWeapon={swapWeapon}
                        moveWeapon={moveWeapon}
                        weaponChoice={weaponChoice}
                        setWeaponChoice={setWeaponChoice}
                        addWeaponToInventory={addWeaponToInventory}
                        weaponTypeBonuses={weaponTypeBonuses}
                        doubloons={doubloons}
                        setDoubloons={setDoubloons}
                        items={items}
                        addItem={addItem}
                        updateItem={updateItem}
                        removeItem={removeItem}
                        moveItem={moveItem}
                        settings={settings}
                        setSettings={setSettings}
                        sortBy={sortBy}
                        setSortBy={setSortBy}
                        sortedActionAbilities={sortedActionAbilities}
                        passiveAbilities={passiveAbilities}
                        background={background}
                        setBackground={setBackground}
                        expansions={expansions}
                        importExpansionFile={importExpansionFile}
                        removeExpansion={removeExpansion}
                        exportExpansions={exportExpansions}
                        downloadGearTemplate={downloadGearTemplate}
                        downloadClassTemplate={downloadClassTemplate}
                    />

                    <div style={{
                        position:"fixed",
                        bottom:"10px",
                        right:"10px",
                        display:"flex",
                        gap:"10px",
                        alignItems:"center"
                    }}>

                    <select
                        value={activeSlot}
                        onChange={e=>{
                            saveToSlot(activeSlot)
                            setActiveSlot(e.target.value)
                        }}
                    >
                        <option value="slot1">Slot 1</option>
                        <option value="slot2">Slot 2</option>
                        <option value="slot3">Slot 3</option>
                    </select>

                    <button onClick={()=>saveToSlot()}>Save</button>

                    <button onClick={exportData}>Export</button>
                    <button onClick={importData}>Import</button>

                    <button onClick={()=>clearSlot()}>Clear Save Slot</button> 

                    <div style={{
                        position:"fixed",
                        bottom:"45px",
                        right:"10px",
                        background:"#222",
                        color:"white",
                        padding:"6px 10px",
                        borderRadius:"4px",
                        fontSize:"12px"
                    }}>
                        {saveMessage}
                    </div>

                    </div>

                    </div>
                )
            }
            
            ReactDOM.createRoot(document.getElementById("root")).render(<App />);
        </script>
    </body>

</html>
